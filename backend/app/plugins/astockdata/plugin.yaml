# a-stock-data 内置可选数据源插件。
# 数据源抓取第三方公开行情接口，使用者需自行评估服务条款与行情版权责任。
name: astockdata
display_name: "a-stock-data（多源行情）"
runtime: python
install_no_deps: true
entry: app.plugins.astockdata.provider:AStockDataProvider
check: app.plugins.astockdata.provider:availability
datasets: [daily, adj_factor, minute, realtime, depth5]
description: "腾讯原始日K/分钟K/五档盘口/实时行情 + 通达信官网北交所盘后日K + 新浪复权因子；腾讯日K成交额为空，分钟成交额为估算。"
install_hint: "行情仅需 requests；分钟最多320根且不支持北交所。北交所日K需等待官网盘后包发布。"
homepage: "https://github.com/simonlin1212/a-stock-data"
upstream:
  repository: "https://github.com/simonlin1212/a-stock-data"
  version: "v3.10.2"
  commit: "29b07d2e37005b9fd568bca1262f6e572b5f9407"
  release_date: "2026-10-11"
